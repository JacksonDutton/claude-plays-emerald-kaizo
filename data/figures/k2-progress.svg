<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" width="760" height="356" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">K2 in Emerald Kaizo: whiteouts and badges over hours of play</title>
<desc id="d">Cumulative whiteouts rise from 0 to 140 over 171 hours of play. Badges 1 to 8 are marked on the line, with Trainer Red, beaten on the fifteenth try, near the end.</desc>
<style>.bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.grid{stroke:#e4e3df;stroke-width:1}.axis{stroke:#9a9993;stroke-width:1}.line{fill:none;stroke:#2a78d6;stroke-width:2;stroke-linejoin:round}.dot{fill:#2a78d6;stroke:#fcfcfb;stroke-width:2}.red{fill:#eb6834;stroke:#fcfcfb;stroke-width:2}@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.ink{fill:#f0efec}.ink2{fill:#c3c2b7}.grid{stroke:#33332f}.axis{stroke:#6f6e68}.line{stroke:#3987e5}.dot{fill:#3987e5;stroke:#1a1a19}.red{fill:#d95926;stroke:#1a1a19}}</style>
