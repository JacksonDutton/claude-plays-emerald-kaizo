<text class="ink" x="56" y="28" font-size="16" font-weight="600">K2 in Emerald Kaizo: 140 whiteouts and eight badges in 171 hours of play</text>
<text class="ink2" x="56" y="48" font-size="12">Line: cumulative whiteouts. Dots 1-8: badges. R: Trainer Red, beaten on the 15th try.</text>
<text class="ink2" x="56" y="65" font-size="12">Hours of play exclude the 23-27 Oct usage pause. Data and script: data/figures/, tools/plot_k2_progress.py.</text>
