<text class="ink2" x="56" y="48" font-size="12">Line: cumulative whiteouts. Dots 1-8: badges. R: Trainer Red, beaten on the fifteenth try.</text>
<text class="ink2" x="56" y="65" font-size="12">Hours of play exclude the 23-27 Oct usage pause. Data and script: data/figures/, tools/plot_k2_progress.py.</text>
