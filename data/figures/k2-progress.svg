<title id="t">K2 in Emerald Kaizo: whiteouts and badges over hours of play</title>
<desc id="d">Cumulative whiteouts rise from 0 to 145 over 173 hours of play. Badges 1 to 8 are marked on the line, with Trainer Red, beaten on the fifteenth try.</desc>
